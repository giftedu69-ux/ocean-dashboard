<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>실시간 해양 관측 대시보드</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f7fb;color:#123}.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;padding:16px;min-height:100vh}#map{height:calc(100vh - 32px);min-height:560px;border-radius:14px}.card{background:#fff;border:1px solid #dce7f0;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 9px #1231}.label{font-weight:700;color:#0671c1}.value{font-weight:700;color:#0671c1}.row{padding:9px 0;border-bottom:1px solid #edf1f5}.bad{background:#fff0f0;color:#a21;border-color:#fecaca}.muted{color:#64748b}@media(max-width:760px){.app{grid-template-columns:1fr}#map{height:55vh;min-height:400px}}
  </style>
</head>
<body><main class="app"><div id="map"></div><aside>
  <section class="card"><div class="label">관측 시각</div><div id="time" class="muted">관측소를 선택하세요.</div></section>
  <section class="card"><h2 id="name">해양관측부이를 선택하세요</h2>
    <div class="row">관측소 코드: <span class="value" id="code">-</span></div>
    <div class="row">수온: <span class="value" id="temp">-</span></div>
    <div class="row">염분: <span class="value" id="sal">-</span></div>
    <div class="row">해수 유속: <span class="value" id="cur">-</span></div>
    <div class="row">유향: <span class="value" id="dir">-</span></div>
  </section>
  <section class="card" id="status">실제 해양관측부이 원을 클릭하면 최신 관측값을 조회합니다.</section>
</aside></main>
<script>
const API_BASE='https://ocean-data-proxy.chaeeecoma.workers.dev';
const buoys=[
  {name:'속초해수욕장',code:'TW_0093',lat:38.198611,lng:128.631389},
  {name:'경포대해수욕장',code:'TW_0089',lat:37.808972,lng:128.931889},
  {name:'부산항',code:'TW_0087',lat:35.09175,lng:129.08525},
  {name:'여수항',code:'TW_0083',lat:34.794722,lng:127.808055},
  {name:'통영항',code:'TW_0084',lat:34.773333,lng:128.46},
  {name:'제주해협',code:'KG_0028',lat:33.700111,lng:126.5905}
];
const el=id=>document.getElementById(id);
const map=L.map('map').setView([35.6,127.8],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
buoys.forEach(p=>L.circleMarker([p.lat,p.lng],{radius:10,color:'#0879c9',fillColor:'#38bdf8',fillOpacity:.85}).addTo(map).bindPopup(`<b>${p.name}</b><br>${p.code}`).on('click',()=>load(p)));
function display(v,unit=''){return v===undefined||v===null||v===''||v==='-'?'-':String(v)+unit}
async function load(p){
  el('name').textContent=p.name;el('code').textContent=p.code;el('status').className='card';el('status').textContent='실제 관측값을 조회 중입니다…';
  ['temp','sal','cur','dir'].forEach(id=>el(id).textContent='조회 중');
  try{
    const res=await fetch(`${API_BASE}/api/buoy?obsCode=${encodeURIComponent(p.code)}`);
    const data=await res.json();
    if(!res.ok)throw new Error(data.detail||data.error||res.status);
    if(!data.observation)throw new Error(data.message||'최신 관측값이 없습니다.');
    const o=data.observation;
    el('time').textContent=o.obsrvnDt||'관측시각 미제공';
    el('temp').textContent=display(o.wtem,' °C');
    el('sal').textContent=display(o.slnty,' PSU');
    el('cur').textContent=display(o.crsp,' cm/s');
    el('dir').textContent=display(o.crdir,'°');
    el('status').textContent='조회 완료 — 실제 해양관측부이 최신 관측값';
  }catch(error){
    el('status').className='card bad';el('status').textContent='API 연동 실패: '+error.message;
    ['temp','sal','cur','dir'].forEach(id=>el(id).textContent='데이터 없음');
  }
}
</script></body></html>
