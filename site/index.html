<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlueCurrent</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{--navy:#0d1c2c;--blue:#0786ed;--side:#e8f6ff;--line:#d8e3ee;--text:#102b43}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text);background:#fff}
    .topbar{height:73px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 28px;gap:13px;box-shadow:0 2px 7px #0016;position:relative;z-index:10}
    .brand-icon{width:27px;height:27px;object-fit:contain}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.live{background:#087ff1;border-radius:999px;font-size:14px;font-weight:800;padding:5px 10px}
    .shell{display:grid;grid-template-columns:76px minmax(0,1fr);height:calc(100vh - 73px)}
    .sidebar{background:var(--side);border-right:1px solid #d7e9f3;padding-top:17px}.nav-item{color:#0075c8;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;padding:8px 14px;white-space:nowrap}
    .workspace{padding:13px;min-width:0}.map-wrap{position:relative;height:100%;min-height:500px;border-radius:15px;overflow:hidden;background:#d1ebf5}#map{width:100%;height:100%;min-height:500px}
    .info-panel{position:absolute;z-index:500;right:18px;top:18px;width:min(355px,calc(100% - 36px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 22px #173b5824;padding:22px;max-height:calc(100% - 36px);overflow-y:auto}
    .eyebrow{font-weight:800;color:#0875c8;font-size:14px;margin-bottom:8px}.time{font-size:15px;color:#5b7185}.station{font-size:28px;letter-spacing:-1px;margin:22px 0 16px;color:#091f33}.data-row{border-top:1px solid #e6eef5;padding:13px 0;font-size:16px}.value{font-weight:800;color:#0076cc}.status{margin-top:18px;border-radius:10px;background:#f0f8ff;color:#1870af;padding:13px;font-size:14px}
    .nifs-layers{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:13px;color:#527087}.nifs-layers span{font-weight:800;color:#0076cc}.prediction{margin-top:18px;padding-top:17px;border-top:1px solid #e6eef5}.prediction-title{font-size:17px;font-weight:850;color:#0b2c48;margin-bottom:5px}.prediction-note{font-size:12px;line-height:1.45;color:#678094;margin-bottom:10px}.species{margin:10px 0}.species-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:750}.score{color:#0076cc}.meter{height:7px;background:#e8f0f6;border-radius:999px;overflow:hidden;margin-top:5px}.meter>span{display:block;height:100%;background:linear-gradient(90deg,#20b4ec,#087ce5);border-radius:inherit;transition:width .35s ease}.prediction.empty .species{opacity:.45}.all-species{border:0;border-radius:8px;background:#e9f5ff;color:#0675c8;font-weight:800;padding:9px 11px;width:100%;margin-top:8px;cursor:pointer}.all-species:disabled{opacity:.5;cursor:default}.modal{display:none;position:absolute;inset:0;z-index:1000;background:#0b223b66;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal-card{width:min(460px,100%);max-height:calc(100% - 24px);overflow:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 15px 45px #001c}.modal-head{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:850;color:#0b2c48}.modal-close{border:0;background:#edf3f8;border-radius:50%;width:30px;height:30px;font-size:20px;cursor:pointer}.leaflet-control-zoom a{font-size:25px!important;width:40px!important;height:39px!important;line-height:38px!important}.leaflet-control-zoom{box-shadow:0 1px 5px #0004!important}.map-legend{position:absolute;z-index:500;left:14px;bottom:18px;background:#fffffff0;border:1px solid #b7d7ee;border-radius:9px;box-shadow:0 2px 9px #00294a22;padding:8px 10px;font-size:12px;color:#28516d;pointer-events:none}.map-legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-2px;border-radius:50%;background:#58bff2aa;border:1px solid #0786ed}.buoy-pin{width:28px;height:28px;background:#168de1;border:3px solid #0068b7;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 7px #003d7a88}.buoy-pin span{display:block;width:8px;height:8px;margin:7px;background:#dff7ff;border-radius:50%}
    @media(max-width:780px){.topbar{height:62px;padding:0 16px}.brand{font-size:17px}.shell{grid-template-columns:1fr;height:calc(100vh - 62px)}.sidebar{display:none}.workspace{padding:8px}.map-wrap,#map{min-height:520px}.info-panel{top:auto;bottom:12px;right:12px;width:calc(100% - 24px);max-height:42vh;padding:14px 16px;border-radius:14px}.station{font-size:22px;margin:10px 0}.data-row{padding:7px 0}.status{margin-top:10px;padding:10px}.prediction{margin-top:10px;padding-top:10px}}
  </style>
</head>
<body>
  <header class="topbar"><img class="brand-icon" alt="BlueCurrent 해양 아이콘" src="app-icon.svg"><div class="brand">BlueCurrent</div><span class="live">AI Live</span></header>
  <div class="shell"><nav class="sidebar"><div class="nav-item">🗺️ 지도</div></nav><main class="workspace"><section class="map-wrap"><div id="map"></div><div class="map-legend"><i></i>인근 부이 참고 영역 · 반경 25km</div>
    <aside class="info-panel"><div id="time-section"><div class="eyebrow">관측 시각</div><div id="time" class="time">관측소를 선택하세요.</div></div><h1 id="name" class="station">해양관측부이를 선택하세요</h1>
      <div class="data-row">관측소 코드: <span id="code" class="value">-</span></div><div class="data-row">관측부이 수온: <span id="temp" class="value">-</span></div><div class="data-row"><div>어장 수온 <span id="nifs-name" class="muted">조회 전</span></div><div class="nifs-layers">표층 <span id="nifs-surface">-</span> · 중층 <span id="nifs-middle">-</span> · 저층 <span id="nifs-bottom">-</span></div></div><div class="data-row"><span id="sal-label">염분</span>: <span id="sal" class="value">-</span></div><div class="data-row"><span id="cur-label">해수 유속</span>: <span id="cur" class="value">-</span></div><div class="data-row"><span id="dir-label">유향</span>: <span id="dir" class="value">-</span></div><div id="status" class="status">실제 해양관측부이 원을 클릭하면 최신 관측값을 조회합니다.</div>
      <section id="prediction" class="prediction empty"><div class="prediction-title">🐟 어종 출현 적합도</div><div class="prediction-note">수온·염분·해수 유속 기준의 참고용 적합도입니다. 상위 3종을 표시합니다.</div><div id="top-species"></div><button id="show-all-species" class="all-species" disabled>전체 11종 보기</button></section>
    </aside><div id="species-modal" class="modal" aria-hidden="true"><div class="modal-card"><div class="modal-head"><span>🐟 전체 어종 적합도</span><button id="close-species-modal" class="modal-close" aria-label="닫기">×</button></div><div class="prediction-note">관측 환경 기반 참고용 지표이며 실제 어획량을 예측하지 않습니다.</div><div id="all-species"></div></div></div></section></main></div>
<script>
const API_BASE='https://ocean-data-proxy.chaeeecoma.workers.dev';
// 큰 원은 해양관측부이, 작은 청록 원은 국립수산과학원 실시간 어장 관측소입니다.
const buoys=[
  // 현재 관측 응답이 확인된 국립해양조사원 해양관측부이
  {name:'속초해수욕장',code:'TW_0093',lat:38.198611,lng:128.631389},
  {name:'낙산해수욕장',code:'TW_0091',lat:38.1225,lng:128.650556},
  {name:'경포대해수욕장',code:'TW_0089',lat:37.808972,lng:128.931889},
  {name:'망상해수욕장',code:'TW_0094',lat:37.61611,lng:129.103056},
  {name:'고래불해수욕장',code:'TW_0095',lat:36.58,lng:129.454083},
  {name:'임랑해수욕장',code:'TW_0092',lat:35.3025,lng:129.2925},
  {name:'송정해수욕장',code:'TW_0090',lat:35.164722,lng:129.219444},
  {name:'부산항',code:'TW_0087',lat:35.09175,lng:129.08525},
  {name:'감천항',code:'TW_0088',lat:35.052805,lng:129.003083},
  {name:'부산항신항',code:'TW_0086',lat:35.043777,lng:128.76175},
  {name:'마산항',code:'TW_0085',lat:35.103194,lng:128.631833},
  {name:'통영항',code:'TW_0084',lat:34.773333,lng:128.46},
  {name:'여수항',code:'TW_0083',lat:34.794722,lng:127.808055},
  {name:'광양항',code:'TW_0074',lat:34.859722,lng:127.792777},
  {name:'남해동부',code:'KG_0025',lat:34.222472,lng:128.419027},
  {name:'중문해수욕장 (제주권)',code:'TW_0075',lat:33.2345,lng:126.409555},
  {name:'제주남부',code:'KG_0021',lat:32.090416,lng:126.965861},
  {name:'우이도',code:'TW_0080',lat:34.543056,lng:125.802778},
  {name:'태안항',code:'TW_0082',lat:37.006722,lng:126.270222},
  {name:'대천해수욕장',code:'TW_0069',lat:36.274111,lng:126.457805},
  {name:'평택당진항',code:'TW_0070',lat:37.136666,lng:126.540833},
  {name:'군산항',code:'TW_0072',lat:35.984166,lng:126.50875}
];
const el=id=>document.getElementById(id), map=L.map('map').setView([35.6,127.8],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const buoyIcon=L.divIcon({className:'',html:'<div class="buoy-pin"><span></span></div>',iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-25]});
buoys.forEach(p=>{
  L.circle([p.lat,p.lng],{radius:25000,color:'#0786ed',weight:1.5,opacity:.7,fillColor:'#58bff2',fillOpacity:.13,interactive:false}).addTo(map);
  L.marker([p.lat,p.lng],{icon:buoyIcon,title:`${p.name} 해양관측부이`})
  .addTo(map).bindPopup(`<b>${p.name}</b><br>해양관측부이 · ${p.code}`).bindTooltip('해양관측부이 · 점 위치',{direction:'top',offset:[0,-28]}).on('click',()=>load(p));
});

async function addNifsMarkers(){
  try{
    const res=await fetch(`${API_BASE}/api/nifs-temperature`),data=await res.json();
    if(!res.ok)throw new Error('NIFS 관측소를 불러오지 못했습니다.');
    (data.stations||[]).filter(s=>Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng))&&s.layers&&Object.keys(s.layers).length)
      .forEach(s=>L.circleMarker([s.lat,s.lng],{radius:8,color:'#008b75',weight:3,fillColor:'#51d7b8',fillOpacity:.88})
      .addTo(map).bindPopup(`<b>${s.name}</b><br>실시간 어장 관측소 · ${s.code}`).on('click',()=>loadNifsStation(s)));
  }catch(error){console.warn(error)}
}
addNifsMarkers();

// 부산 연안 수질 측정망: 수온·염분은 실제 측정값이며 분기별 측정시점을 함께 표시합니다.
const busanSites=[
  {name:'5부두',lat:35.115,lng:129.047},{name:'감천항',lat:35.078,lng:129.000},{name:'광안리',lat:35.153,lng:129.118},
  {name:'고리',lat:35.221,lng:129.258},{name:'남항',lat:35.077,lng:129.057},{name:'다대포',lat:35.046,lng:128.966},
  {name:'녹산',lat:35.095,lng:128.837},{name:'송도',lat:35.076,lng:129.021},{name:'해운대',lat:35.158,lng:129.160},
  {name:'이기대',lat:35.115,lng:129.119},{name:'신호',lat:35.088,lng:128.878},{name:'장림',lat:35.081,lng:128.962},
  {name:'동천',lat:35.130,lng:129.050},{name:'대변',lat:35.238,lng:129.250},{name:'민락동',lat:35.154,lng:129.130}
];
busanSites.forEach(p=>L.circleMarker([p.lat,p.lng],{radius:9,color:'#e07300',weight:3,fillColor:'#ffc14f',fillOpacity:.9})
  .addTo(map).bindPopup(`<b>${p.name}</b><br>부산 해양환경 측정망`).on('click',()=>loadBusanStation(p)));
let busanMarinePromise;
async function fetchBusanMarine(){
  if(!busanMarinePromise)busanMarinePromise=fetch('busan-marine.json?v=20260729-2',{cache:'no-store'}).then(async res=>{
    const raw=await res.text();let data;
    try{data=JSON.parse(raw)}catch{throw new Error('부산 측정망 배포 데이터 형식이 올바르지 않습니다. GitHub Actions를 다시 실행해 주세요.')}
    if(!res.ok||data.error)throw new Error(data.error||res.status);
    const items=data.stations||data?.response?.body?.items?.item||[];
    const newest=new Map();
    items.forEach(item=>{
      const name=item.name||item.site||item.siteNm||item.siteName||'';
      if(!name)return;
      const station={name,observedYear:item.observedYear||item.inspecYy||'',observedQuarter:item.observedQuarter||item.inspecQt||'',temperature:item.temperature??item.water14??null,salinity:item.salinity??item.water16??null,dissolvedOxygen:item.dissolvedOxygen??item.water13??null,quality:item.quality||item.water02||''};
      const previous=newest.get(name),key=Number(station.observedYear)*10+Number(station.observedQuarter||0),oldKey=previous?Number(previous.observedYear)*10+Number(previous.observedQuarter||0):-1;
      if(key>=oldKey)newest.set(name,station);
    });
    return [...newest.values()];
  }).catch(error=>{busanMarinePromise=null;throw error});
  return busanMarinePromise;
}
async function loadBusanStation(p){
  setEnvironmentLabels();
  el('time-section').style.display='none';
  el('name').textContent=p.name;
  el('code').textContent='BUSAN_MARINE';
  el('status').textContent='부산 연안 수온·염분 실측값을 조회 중입니다…';
  ['temp','sal','cur','dir'].forEach(id=>el(id).textContent='조회 중');
  ['surface','middle','bottom'].forEach(id=>el('nifs-'+id).textContent='-');
  el('nifs-name').textContent='(해당 없음)';
  clearSuitability();
  try{
    const stations=await fetchBusanMarine();
    const compact=v=>String(v||'').replace(/\s/g,'').replace('해수욕장','');
    const station=stations.find(s=>compact(s.name)===compact(p.name)||compact(s.name).includes(compact(p.name)));
    if(!station)throw new Error('해당 지점의 제공 데이터가 없습니다.');
    el('temp').textContent=display(station.temperature,' °C');
    el('sal').textContent=display(station.salinity,' PSU');
    const nearby=await loadNearestBuoyFlow(p);
    if(nearby.observation)updateSuitability({wtem:Number(station.temperature),slnty:Number(station.salinity),crsp:Number(nearby.observation.crsp)});
    else clearSuitability();
    el('status').textContent=`부산 해양환경 측정망 수온·염분과 인근 부이 유속을 조합한 참고용 적합도입니다. 유속·유향 출처: ${nearby.source}`;
  }catch(error){
    ['temp','sal','cur','dir'].forEach(id=>el(id).textContent='데이터 없음');
    el('status').textContent='부산 측정망 API 연동 실패: '+error.message;
  }
}
function display(v,unit=''){return v===undefined||v===null||v===''||v==='-'?'-':String(v)+unit}
function setEnvironmentLabels(mode='local'){
  el('sal-label').textContent=mode==='all-nearby'?'인근 부이 염분':'염분';
  el('cur-label').textContent=mode==='local'?'해수 유속':'인근 부이 해수 유속';
  el('dir-label').textContent=mode==='local'?'유향':'인근 부이 유향';
}
function distanceKm(a,b){const r=6371,d=Math.PI/180,dy=(b.lat-a.lat)*d,dx=(b.lng-a.lng)*d;const h=Math.sin(dy/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin(dx/2)**2;return 2*r*Math.asin(Math.sqrt(h))}
async function loadNifsTemperature(point){const ids=['surface','middle','bottom'];ids.forEach(id=>el('nifs-'+id).textContent='조회 중');el('nifs-name').textContent='(수산과학원)';try{const res=await fetch(`${API_BASE}/api/nifs-temperature`),data=await res.json();if(!res.ok)throw new Error(data.detail||data.error||res.status);const stations=(data.stations||[]).filter(s=>s.layers&&Object.keys(s.layers).length);if(!stations.length)throw new Error('관측소 데이터 없음');const near=stations.reduce((best,s)=>!best||distanceKm(point,s)<distanceKm(point,best)?s:best,null);el('nifs-name').textContent=`(${near.name}, 최근접 ${distanceKm(point,near).toFixed(0)}km)`;ids.forEach(id=>el('nifs-'+id).textContent=display(near.layers[id],' °C'));}catch(error){el('nifs-name').textContent='(수산과학원 데이터 없음)';ids.forEach(id=>el('nifs-'+id).textContent='-')}}
async function loadNearestBuoyFlow(point){
  setEnvironmentLabels('flow-nearby');
  ['cur','dir'].forEach(id=>el(id).textContent='조회 중');
  const near=buoys.reduce((best,p)=>!best||distanceKm(point,p)<distanceKm(point,best)?p:best,null);
  try{
    const res=await fetch(`${API_BASE}/api/buoy?obsCode=${encodeURIComponent(near.code)}`),data=await res.json();
    if(!res.ok||!data.observation)throw new Error(data.detail||data.error||data.message||'최신 관측값이 없습니다.');
    const o=data.observation, distance=distanceKm(point,near).toFixed(0);
    el('cur').textContent=display(o.crsp,' cm/s');
    el('dir').textContent=display(o.crdir,'°');
    return {source:`${near.name} 부이 · 약 ${distance}km · ${o.obsrvnDt||'관측시각 미제공'}`,observation:o};
  }catch(error){
    ['cur','dir'].forEach(id=>el(id).textContent='데이터 없음');
    return {source:`인근 해양관측부이 자료를 불러오지 못했습니다: ${error.message}`,observation:null};
  }
}
async function loadNearestBuoyEnvironment(point){
  setEnvironmentLabels('all-nearby');
  ['sal','cur','dir'].forEach(id=>el(id).textContent='조회 중');
  const near=buoys.reduce((best,p)=>!best||distanceKm(point,p)<distanceKm(point,best)?p:best,null);
  try{
    const res=await fetch(`${API_BASE}/api/buoy?obsCode=${encodeURIComponent(near.code)}`),data=await res.json();
    if(!res.ok||!data.observation)throw new Error(data.detail||data.error||data.message||'최신 관측값이 없습니다.');
    const o=data.observation, distance=distanceKm(point,near).toFixed(0);
    el('sal').textContent=display(o.slnty,' PSU');
    el('cur').textContent=display(o.crsp,' cm/s');
    el('dir').textContent=display(o.crdir,'°');
    return {source:`${near.name} 부이 · 약 ${distance}km · ${o.obsrvnDt||'관측시각 미제공'}`,observation:o};
  }catch(error){
    ['sal','cur','dir'].forEach(id=>el(id).textContent='데이터 없음');
    return {source:`인근 해양관측부이 자료를 불러오지 못했습니다: ${error.message}`,observation:null};
  }
}
async function loadNifsStation(s){
  el('time-section').style.display='block';
  setEnvironmentLabels('all-nearby');
  const layers=s.layers||{}, dist='';
  el('name').textContent=s.name;
  el('code').textContent='NIFS_'+s.code;
  el('time').textContent=s.observedAt||'관측시각 미제공';
  el('temp').textContent=display(layers.surface,' °C');
  el('sal').textContent='조회 중';
  el('cur').textContent='조회 중';
  el('dir').textContent='조회 중';
  el('nifs-name').textContent='(국립수산과학원 실측)';
  ['surface','middle','bottom'].forEach(id=>el('nifs-'+id).textContent=display(layers[id],' °C'));
  clearSuitability();
  const nearby=await loadNearestBuoyEnvironment(s);
  if(nearby.observation)updateSuitability({wtem:Number(layers.surface),slnty:Number(nearby.observation.slnty),crsp:Number(nearby.observation.crsp)});
  else clearSuitability();
  el('status').textContent=`국립수산과학원 수온과 인근 부이 환경값을 조합한 참고용 적합도입니다. 인근 부이 출처: ${nearby.source}`;
}

function metricScore(value,min,max,margin){if(!Number.isFinite(value))return null;if(value>=min&&value<=max)return 100;const gap=value<min?min-value:value-max;return Math.max(0,Math.round(100*(1-gap/margin)))}
function weightedScore(o,profile){if([o.wtem,o.slnty,o.crsp].some(v=>v===undefined||v===null||v===''))return null;const values=[metricScore(Number(o.wtem),profile.temp[0],profile.temp[1],profile.temp[2]),metricScore(Number(o.slnty),profile.sal[0],profile.sal[1],profile.sal[2]),metricScore(Number(o.crsp),profile.current[0],profile.current[1],profile.current[2])];if(values.some(v=>v===null))return null;return Math.round(values[0]*.5+values[1]*.3+values[2]*.2)}
const profiles={mackerel:{name:'고등어',temp:[14,23,8],sal:[29,35,5],current:[15,130,110]},squid:{name:'오징어',temp:[16,24,7],sal:[29,35,5],current:[10,110,100]},hairtail:{name:'갈치',temp:[18,27,7],sal:[28,35,5],current:[10,100,110]},anchovy:{name:'멸치',temp:[15,24,8],sal:[29,35,5],current:[10,85,90]},horseMackerel:{name:'전갱이',temp:[17,26,8],sal:[29,35,5],current:[15,110,100]},spanishMackerel:{name:'삼치',temp:[15,25,8],sal:[29,35,5],current:[15,120,110]},yellowtail:{name:'방어',temp:[14,24,8],sal:[29,35,5],current:[15,125,110]},flounder:{name:'넙치(광어)',temp:[14,23,8],sal:[28,35,6],current:[5,80,100]},rockfish:{name:'조피볼락(우럭)',temp:[10,21,8],sal:[28,35,6],current:[5,75,100]},seaBass:{name:'농어',temp:[15,25,8],sal:[24,35,10],current:[5,100,110]},mullet:{name:'숭어',temp:[12,26,9],sal:[18,35,12],current:[5,90,110]}};
let suitability=[];
function speciesHtml(item){const text=item.score===null?'데이터 부족':item.score+'%';const width=item.score===null?0:item.score;return `<div class="species"><div class="species-head"><span>${item.name}</span><strong class="score">${text}</strong></div><div class="meter"><span style="width:${width}%"></span></div></div>`}
function renderSuitability(){const ranked=[...suitability].sort((a,b)=>(b.score??-1)-(a.score??-1));el('top-species').innerHTML=ranked.slice(0,3).map(speciesHtml).join('');el('all-species').innerHTML=ranked.map(speciesHtml).join('');el('show-all-species').disabled=ranked.length===0}
function updateSuitability(o){suitability=Object.entries(profiles).map(([id,p])=>({id,name:p.name,score:weightedScore(o,p)}));renderSuitability();el('prediction').classList.remove('empty')}
function clearSuitability(){suitability=[];renderSuitability();el('prediction').classList.add('empty')}
el('show-all-species').addEventListener('click',()=>{el('species-modal').classList.add('open');el('species-modal').setAttribute('aria-hidden','false')});
el('close-species-modal').addEventListener('click',()=>{el('species-modal').classList.remove('open');el('species-modal').setAttribute('aria-hidden','true')});
el('species-modal').addEventListener('click',e=>{if(e.target===el('species-modal'))el('close-species-modal').click()});
async function load(p){setEnvironmentLabels();el('time-section').style.display='block';el('name').textContent=p.name;el('code').textContent=p.code;el('status').textContent='실제 관측값을 조회 중입니다…';['temp','sal','cur','dir'].forEach(id=>el(id).textContent='조회 중');['surface','middle','bottom'].forEach(id=>el('nifs-'+id).textContent='-');el('nifs-name').textContent='조회 중';clearSuitability();try{const res=await fetch(`${API_BASE}/api/buoy?obsCode=${encodeURIComponent(p.code)}`),data=await res.json();if(!res.ok)throw new Error(data.detail||data.error||res.status);if(!data.observation)throw new Error(data.message||'최신 관측값이 없습니다.');const o=data.observation;el('time').textContent=o.obsrvnDt||'관측시각 미제공';el('temp').textContent=display(o.wtem,' °C');el('sal').textContent=display(o.slnty,' PSU');el('cur').textContent=display(o.crsp,' cm/s');el('dir').textContent=display(o.crdir,'°');updateSuitability(o);loadNifsTemperature(p);el('status').textContent='조회 완료 — 실제 해양관측부이 최신 관측값';}catch(error){el('status').textContent='API 연동 실패: '+error.message;['temp','sal','cur','dir'].forEach(id=>el(id).textContent='데이터 없음')}}
</script></body></html>
