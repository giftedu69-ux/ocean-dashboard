<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlueCurrent</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{--navy:#0d1c2c;--blue:#0786ed;--side:#e8f6ff;--line:#d8e3ee;--text:#102b43}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text);background:#fff}
    .topbar{height:73px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 28px;gap:13px;box-shadow:0 2px 7px #0016;position:relative;z-index:10}
    .brand-icon{width:27px;height:27px;object-fit:contain}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.live{background:#087ff1;border-radius:999px;font-size:14px;font-weight:800;padding:5px 10px}
    .shell{display:grid;grid-template-columns:76px minmax(0,1fr);height:calc(100vh - 73px)}
    .sidebar{background:var(--side);border-right:1px solid #d7e9f3;padding-top:17px}.nav-item{color:#0075c8;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;padding:8px 14px;white-space:nowrap}
    .workspace{padding:13px;min-width:0}.map-wrap{position:relative;height:100%;min-height:500px;border-radius:15px;overflow:hidden;background:#d1ebf5}#map{width:100%;height:100%;min-height:500px}
    .info-panel{position:absolute;z-index:500;right:18px;top:18px;width:min(355px,calc(100% - 36px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 22px #173b5824;padding:22px}
    .eyebrow{font-weight:800;color:#0875c8;font-size:14px;margin-bottom:8px}.time{font-size:15px;color:#5b7185}.station{font-size:28px;letter-spacing:-1px;margin:22px 0 16px;color:#091f33}.data-row{border-top:1px solid #e6eef5;padding:13px 0;font-size:16px}.value{font-weight:800;color:#0076cc}.status{margin-top:18px;border-radius:10px;background:#f0f8ff;color:#1870af;padding:13px;font-size:14px}
    .prediction{margin-top:18px;padding-top:17px;border-top:1px solid #e6eef5}.prediction-title{font-size:17px;font-weight:850;color:#0b2c48;margin-bottom:5px}.prediction-note{font-size:12px;line-height:1.45;color:#678094;margin-bottom:12px}.species{margin:11px 0}.species-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:750}.score{color:#0076cc}.meter{height:8px;background:#e8f0f6;border-radius:999px;overflow:hidden;margin-top:6px}.meter > span{display:block;height:100%;width:0;background:linear-gradient(90deg,#20b4ec,#087ce5);border-radius:inherit;transition:width .35s ease}.prediction.empty .species{opacity:.45}.leaflet-control-zoom a{font-size:25px!important;width:40px!important;height:39px!important;line-height:38px!important}.leaflet-control-zoom{box-shadow:0 1px 5px #0004!important}
    @media(max-width:780px){.topbar{height:62px;padding:0 16px}.brand{font-size:17px}.shell{grid-template-columns:1fr;height:calc(100vh - 62px)}.sidebar{display:none}.workspace{padding:8px}.map-wrap,#map{min-height:520px}.info-panel{top:auto;bottom:12px;right:12px;width:calc(100% - 24px);padding:16px}.station{font-size:22px;margin:12px 0}.data-row{padding:8px 0}}
  </style>
</head>
<body>
  <header class="topbar"><img class="brand-icon" alt="BlueCurrent 해양 아이콘" src="app-icon.svg"><div class="brand">BlueCurrent</div><span class="live">AI Live</span></header>
  <div class="shell"><nav class="sidebar"><div class="nav-item">🗺️ 지도</div></nav><main class="workspace"><section class="map-wrap"><div id="map"></div>
    <aside class="info-panel"><div class="eyebrow">관측 시각</div><div id="time" class="time">관측소를 선택하세요.</div><h1 id="name" class="station">해양관측부이를 선택하세요</h1>
      <div class="data-row">관측소 코드: <span id="code" class="value">-</span></div><div class="data-row">수온: <span id="temp" class="value">-</span></div><div class="data-row">염분: <span id="sal" class="value">-</span></div><div class="data-row">해수 유속: <span id="cur" class="value">-</span></div><div class="data-row">유향: <span id="dir" class="value">-</span></div><div id="status" class="status">실제 해양관측부이 원을 클릭하면 최신 관측값을 조회합니다.</div>
      <section id="prediction" class="prediction empty"><div class="prediction-title">🐟 어종 출현 적합도</div><div class="prediction-note">관측 수온·염분·해수 유속 기반의 참고용 적합도입니다.</div>
        <div class="species"><div class="species-head"><span>고등어</span><strong id="mackerel-score" class="score">-</strong></div><div class="meter"><span id="mackerel-bar"></span></div></div>
        <div class="species"><div class="species-head"><span>오징어</span><strong id="squid-score" class="score">-</strong></div><div class="meter"><span id="squid-bar"></span></div></div>
        <div class="species"><div class="species-head"><span>갈치</span><strong id="hairtail-score" class="score">-</strong></div><div class="meter"><span id="hairtail-bar"></span></div></div>
      </section>
    </aside></section></main></div>
<script>
const API_BASE='https://ocean-data-proxy.chaeeecoma.workers.dev';
const buoys=[{name:'속초해수욕장',code:'TW_0093',lat:38.198611,lng:128.631389},{name:'경포대해수욕장',code:'TW_0089',lat:37.808972,lng:128.931889},{name:'부산항',code:'TW_0087',lat:35.09175,lng:129.08525},{name:'여수항',code:'TW_0083',lat:34.794722,lng:127.808055},{name:'통영항',code:'TW_0084',lat:34.773333,lng:128.46},{name:'제주해협',code:'KG_0028',lat:33.700111,lng:126.5905}];
const el=id=>document.getElementById(id), map=L.map('map').setView([35.6,127.8],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
buoys.forEach(p=>L.circleMarker([p.lat,p.lng],{radius:25,color:'#0078c9',weight:4,fillColor:'#37b8ef',fillOpacity:.62}).addTo(map).bindPopup(`<b>${p.name}</b><br>${p.code}`).on('click',()=>load(p)));
function display(v,unit=''){return v===undefined||v===null||v===''||v==='-'?'-':String(v)+unit}
function metricScore(value,min,max,margin){if(!Number.isFinite(value))return null;if(value>=min&&value<=max)return 100;const gap=value<min?min-value:value-max;return Math.max(0,Math.round(100*(1-gap/margin)))}
function weightedScore(o,profile){const values=[metricScore(Number(o.wtem),profile.temp[0],profile.temp[1],profile.temp[2]),metricScore(Number(o.slnty),profile.sal[0],profile.sal[1],profile.sal[2]),metricScore(Number(o.crsp),profile.current[0],profile.current[1],profile.current[2])];if(values.some(v=>v===null))return null;return Math.round(values[0]*.5+values[1]*.3+values[2]*.2)}
function setSpecies(id,score){el(id+'-score').textContent=score===null?'데이터 부족':score+'%';el(id+'-bar').style.width=score===null?'0%':score+'%'}
function updateSuitability(o){const profiles={mackerel:{temp:[14,23,8],sal:[29,35,5],current:[15,130,110]},squid:{temp:[16,24,7],sal:[29,35,5],current:[10,110,100]},hairtail:{temp:[18,27,7],sal:[28,35,5],current:[10,100,110]}};Object.entries(profiles).forEach(([id,p])=>setSpecies(id,weightedScore(o,p)));el('prediction').classList.remove('empty')}
function clearSuitability(){['mackerel','squid','hairtail'].forEach(id=>setSpecies(id,null));el('prediction').classList.add('empty')}
async function load(p){el('name').textContent=p.name;el('code').textContent=p.code;el('status').textContent='실제 관측값을 조회 중입니다…';['temp','sal','cur','dir'].forEach(id=>el(id).textContent='조회 중');clearSuitability();try{const res=await fetch(`${API_BASE}/api/buoy?obsCode=${encodeURIComponent(p.code)}`),data=await res.json();if(!res.ok)throw new Error(data.detail||data.error||res.status);if(!data.observation)throw new Error(data.message||'최신 관측값이 없습니다.');const o=data.observation;el('time').textContent=o.obsrvnDt||'관측시각 미제공';el('temp').textContent=display(o.wtem,' °C');el('sal').textContent=display(o.slnty,' PSU');el('cur').textContent=display(o.crsp,' cm/s');el('dir').textContent=display(o.crdir,'°');updateSuitability(o);el('status').textContent='조회 완료 — 실제 해양관측부이 최신 관측값';}catch(error){el('status').textContent='API 연동 실패: '+error.message;['temp','sal','cur','dir'].forEach(id=>el(id).textContent='데이터 없음')}}
</script></body></html>
