<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해양 실시간 정보</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0;font-family:system-ui;background:#f3f7fb;color:#123}.app{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;height:100vh;box-sizing:border-box}#map{height:100%;border-radius:14px}.card{background:#fff;border:1px solid #dce7f0;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 9px #1231}.value{font-weight:700;color:#0671c1}.row{padding:9px 0;border-bottom:1px solid #edf1f5}.bad{color:#a21;background:#fff0f0}@media(max-width:760px){.app{grid-template-columns:1fr;height:auto}#map{height:55vh}}</style></head><body><main class="app"><div id="map"></div><aside><section class="card"><b>요청 시각</b><div id="time">지점을 선택하세요.</div></section><section class="card"><h2 id="name">해역을 선택하세요</h2><div class="row">격자: <span class="value" id="grid">-</span></div><div class="row">수온: <span class="value" id="temp">-</span></div><div class="row">염분: <span class="value" id="sal">-</span></div><div class="row">해수유동: <span class="value" id="cur">-</span></div></section><section class="card" id="status">지도의 원을 눌러 조회하세요.</section></aside></main><script>
// Worker 배포 뒤 실제 주소로 교체. 끝의 / 는 넣지 마세요.
const API_BASE='https://ocean-data-proxy.chaeeecoma.workers.dev/';
const points=[{name:'동해 중부 (강릉/동해)',lat:37.6,lng:129.2,gridCd:'GR2_E2B03'},{name:'부산 기장 연안',lat:35.2,lng:129.3,gridCd:'GR2_F1I10'},{name:'여수 가막만/나로도',lat:34.5,lng:127.7,gridCd:'GR2_I1C02'},{name:'제주 연안',lat:33.15,lng:126.55,gridCd:'GR2_A1B02'}];
const map=L.map('map').setView([35.5,127.8],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);points.forEach(p=>L.circle([p.lat,p.lng],{radius:18000,color:'#0879c9',fillColor:'#38bdf8',fillOpacity:.5}).addTo(map).on('click',()=>load(p)));
const el=id=>document.getElementById(id);function slot(){const d=new Date(Date.now()-3600000),z=n=>String(n).padStart(2,'0');d.setMinutes(Math.floor(d.getMinutes()/15)*15,0,0);return{ymd:`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}`,tm:`${z(d.getHours())}${z(d.getMinutes())}`}}function tag(xml,names){const doc=new DOMParser().parseFromString(xml,'text/xml');for(const n of names){const v=doc.querySelector(n)?.textContent?.trim();if(v)return v}return '-'}
async function load(p){const{sYmd,sTm}= {},{ymd,tm}=slot();el('name').textContent=p.name;el('grid').textContent=p.gridCd;el('time').textContent=`${ymd} ${tm}`;el('status').className='card';el('status').textContent='수온·염분·해수유동 API를 병렬 조회 중…';['temp','sal','cur'].forEach(id=>el(id).textContent='조회 중');try{const r=await fetch(`${API_BASE}/api/ocean?gridCd=${p.gridCd}&analsYmd=${ymd}&analsTime=${tm}`);const data=await r.json();if(!r.ok)throw new Error(data.detail||data.error||r.status);el('temp').textContent=tag(data.temperature,['wtem','water_temp','WATER_TEMP'])+' °C';el('sal').textContent=tag(data.salinity,['sal','salinity','SALINITY'])+' PSU';el('cur').textContent=tag(data.current,['current','current_speed','CUR_SPEED'])+' m/s';el('status').textContent='조회 완료';}catch(e){el('status').className='card bad';el('status').textContent='API 연동 실패: '+e.message;['temp','sal','cur'].forEach(id=>el(id).textContent='데이터 없음')}}
</script></body></html>
